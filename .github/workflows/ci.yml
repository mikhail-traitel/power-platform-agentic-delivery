name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # Hook checks (diff-aware regex + AST + eval-integrity) and the review-pipeline
      # determinism regression (the worked run under examples/review-run must reproduce).
      - name: Run tests
        run: npm test
